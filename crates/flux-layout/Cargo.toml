# Box tree. Reads flux-dom and flux-style.
# Text width comes from flux-ttf. Image intrinsic sizes come from flux-image.
# flux-paint walks the boxes this crate returns. This crate does not paint pixels.

[package]
name = "flux-layout"
description = "Block, inline, flex, table, and positioned boxes."
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "Apache-2.0"
publish.workspace = true

[dependencies]
flux-dom = { path = "../flux-dom" }
flux-style = { path = "../flux-style" }
flux-image.workspace = true
flux-ttf.workspace = true
