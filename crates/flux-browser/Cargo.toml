# Application crate. Two binaries: `flux` (window, headless raster, --tab-worker)
# and `flux-setup` (packaged setup). Calls every engine crate plus the siblings
# listed below.
# flux-cipher is a non-Windows dependency only. Linux profile.flx is AES-256-GCM.
# Windows profile.flx is DPAPI and does not link flux-cipher.
# flux-compress wraps the profile snapshot and the setup payload.
# flux-gpu, flux-image, flux-json, flux-ttf, and flux-video are used by the
# session directly as well as by the engine crates.

[package]
name = "flux-browser"
description = "Window, pages, downloads, and the profile file."
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "LicenseRef-Proprietary"
publish.workspace = true

[[bin]]
name = "flux"
path = "src/main.rs"

[[bin]]
name = "flux-setup"
path = "src/bin/flux-setup.rs"

[dependencies]
flux-dom = { path = "../flux-dom" }
flux-layout = { path = "../flux-layout" }
flux-net = { path = "../flux-net" }
flux-paint = { path = "../flux-paint" }
flux-raster = { path = "../flux-raster" }
flux-sandbox = { path = "../flux-sandbox" }
flux-script = { path = "../flux-script" }
flux-style = { path = "../flux-style" }
flux-compress.workspace = true
flux-gpu.workspace = true
flux-image.workspace = true
flux-json.workspace = true
flux-ttf.workspace = true
flux-video.workspace = true

[target.'cfg(not(windows))'.dependencies]
flux-cipher.workspace = true
