# CSS parser and cascade. Reads flux-dom nodes. Does not place boxes.
# flux-layout reads the computed style. flux-raster also reads style values
# that the display list did not fully flatten.

[package]
name = "flux-style"
description = "CSS cascade and media queries."
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "Apache-2.0"
publish.workspace = true

[dependencies]
flux-dom = { path = "../flux-dom" }
