# Budgeted script interpreter. Mutates flux-dom. Parses JSON with flux-json.
# The optional C++ VM is not a general compiler. eval_script uses it only for
# a script the compiler accepts that does not touch the DOM, fetch(), or storage.
# fetch() is same-origin only and runs in the Rust interpreter.
# A registered mock wins. Otherwise a host callback runs. This crate does not
# open a socket and does not link flux-net. The numeric VM does not perform fetch.
# flux-browser implements the host with flux-net.

[package]
name = "flux-script"
description = "A small script interpreter. The C++ file only does arithmetic."
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "Apache-2.0"
publish.workspace = true

[dependencies]
flux-dom = { path = "../flux-dom" }
flux-json.workspace = true
