# CSS parser and cascade. Reads root-dom nodes. Does not place boxes.
# root-layout reads the computed style. root-raster also reads style values
# that the display list did not fully flatten.

[package]
name = "root-style"
description = "CSS cascade and media queries."
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "Apache-2.0"
publish.workspace = true

[dependencies]
root-dom = { path = "../root-dom" }
