# Desktop browser workspace. Crate version 0.18.0. Not published.
#
# Page pipeline, in order:
#   anvil-dom parses HTML into one node list.
#   anvil-style computes the cascade for those nodes.
#   anvil-layout places boxes and measures text with anvil-ttf.
#   anvil-paint records a display list and applies zoom.
#   anvil-raster fills a CPU framebuffer from that list (with C++20 scanline/SDF/compositor helpers).
#
# Beside that pipeline:
#   anvil-script runs a budgeted JS runtime and C++20 AnvilVM register bytecode interpreter against the document and uses anvil-json.
#   anvil-net loads HTTP and HTTPS documents and uses anvil-compress and anvil-json.
#   anvil-sandbox applies process limits. An http(s) load starts one --tab-worker.
#   anvil:// pages and files still render in the window process.
#   anvil-browser owns the window, tabs, downloads, and the sealed profile file (with persisted localStorage).
#
# The seven libraries under [workspace.dependencies] are separate repositories
# that sit next to this directory. anvil-cipher is linked only by anvil-browser
# on non-Windows targets (Linux profile sealing). Windows sealing uses DPAPI
# inside anvil-browser and does not link anvil-cipher.
#
# Apache-2.0: anvil-dom, anvil-style, anvil-layout, anvil-paint, anvil-raster, anvil-script.
# LicenseRef-Proprietary: anvil-net, anvil-sandbox, anvil-browser, frontend/, and the logo asset.
# MPL-2.0: anvil-cipher, anvil-compress, anvil-image, anvil-json, anvil-ttf, anvil-gpu, anvil-video.

[workspace]
resolver = "3"
members = [
    "crates/anvil-dom",
    "crates/anvil-style",
    "crates/anvil-layout",
    "crates/anvil-paint",
    "crates/anvil-raster",
    "crates/anvil-script",
    "crates/anvil-net",
    "crates/anvil-sandbox",
    "crates/anvil-browser",
]

[workspace.package]
version = "0.18.0"
edition = "2024"
authors = ["Buntos <324143321+buntatoes@users.noreply.github.com>"]
description = "Small desktop browser (Proof of Concept). HTML, CSS, layout, C++20 raster compositor, and C++20 AnvilVM script runtime."
license = "Apache-2.0 AND LicenseRef-Proprietary"
repository = "https://github.com/buntatoes/anvil-browser"
publish = false

[workspace.dependencies]
anvil-compress = { path = "../anvil-compress" }
anvil-cipher = { path = "../anvil-cipher" }
anvil-image = { path = "../anvil-image" }
anvil-json = { path = "../anvil-json" }
anvil-ttf = { path = "../anvil-ttf" }
anvil-gpu = { path = "../anvil-gpu" }
anvil-video = { path = "../anvil-video" }
