# Display list and zoom (50% to 250%). Reads flux-layout boxes.
# flux-raster is the only consumer. This crate does not write a framebuffer.

[package]
name = "flux-paint"
description = "Display list and zoom."
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "Apache-2.0"
publish.workspace = true

[dependencies]
flux-layout = { path = "../flux-layout" }
