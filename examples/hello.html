<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Hello</title>
    <link rel="stylesheet" href="theme.css">
    <style>
      body {
        background: #1c1a17;
        color: #f2efe9;
        font-size: 18px;
        margin: 24px;
      }
      h1 {
        font-size: 36px;
        color: #e8c37a;
        margin: 0 0 12px 0;
      }
      p { margin: 0 0 12px 0; }
      a { color: #7ab8e8; }
      .row {
        display: flex;
        flex-direction: row;
        gap: 12px;
        align-items: center;
        margin-top: 12px;
      }
      .card {
        background: #25221e;
        border: 1px solid #4a4339;
        border-radius: 6px;
        padding: 12px;
      }
      #action-btn {
        background: #3a342c;
        color: #f2efe9;
        border: 1px solid #e8c37a;
        border-radius: 6px;
        padding: 6px 12px;
      }
    </style>
  </head>
  <body>
    <h1>Anvil</h1>
    <p>A browser with its own page engine.</p>
    <div class="row">
      <div class="card">Flexbox &amp; Border Box</div>
      <button id="action-btn">Run Script</button>
      <span id="status">Ready</span>
    </div>
    <p><a href="second.html">Open the second page</a></p>
    <form action="second.html" method="get">
      <div class="row">
        <input id="search-box" name="q" placeholder="Type query...">
        <input id="remember" type="checkbox" name="remember" value="1" checked>
        <input type="submit" value="Go">
      </div>
    </form>
    <script>
      let btn = document.getElementById("action-btn");
      btn.addEventListener("click", function() {
        let status = document.getElementById("status");
        status.textContent = "Clicked!";
        status.style.color = "#8fd19e";
      });
    </script>
  </body>
</html>
