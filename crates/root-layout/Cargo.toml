# Box tree. Reads root-dom and root-style.
# Text width comes from root-ttf. Image intrinsic sizes come from root-image.
# root-paint walks the boxes this crate returns. This crate does not paint pixels.

[package]
name = "root-layout"
description = "Block, inline, flex, table, and positioned boxes."
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "Apache-2.0"
publish.workspace = true

[dependencies]
root-dom = { path = "../root-dom" }
root-style = { path = "../root-style" }
root-image.workspace = true
root-ttf.workspace = true
