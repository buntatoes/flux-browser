# Desktop browser workspace. Crate version 0.18.0. Not published.
#
# Page pipeline, in order:
#   root-dom parses HTML into one node list.
#   root-style computes the cascade for those nodes.
#   root-layout places boxes and measures text with root-ttf.
#   root-paint records a display list and applies zoom.
#   root-raster fills a CPU framebuffer from that list (with C++20 scanline/SDF/compositor helpers).
#
# Beside that pipeline:
#   root-script runs a budgeted JS runtime and C++20 RootVM register bytecode interpreter against the document and uses root-json.
#   root-net loads HTTP and HTTPS documents and uses root-compress and root-json.
#   root-sandbox applies process limits. An http(s) load starts one --tab-worker.
#   root:// pages and files still render in the window process.
#   root-browser owns the window, tabs, downloads, and the sealed profile file (with persisted localStorage).
#
# The seven libraries under [workspace.dependencies] are separate repositories
# that sit next to this directory. root-cipher is linked only by root-browser
# on non-Windows targets (Linux profile sealing). Windows sealing uses DPAPI
# inside root-browser and does not link root-cipher.
#
# Apache-2.0: root-dom, root-style, root-layout, root-paint, root-raster, root-script.
# LicenseRef-Proprietary: root-net, root-sandbox, root-browser, frontend/, and the logo asset.
# MPL-2.0: root-cipher, root-compress, root-image, root-json, root-ttf, root-gpu, root-video.

[workspace]
resolver = "3"
members = [
    "crates/root-dom",
    "crates/root-style",
    "crates/root-layout",
    "crates/root-paint",
    "crates/root-raster",
    "crates/root-script",
    "crates/root-net",
    "crates/root-sandbox",
    "crates/root-browser",
]

[workspace.package]
version = "0.18.0"
edition = "2024"
authors = ["Buntos <324143321+buntatoes@users.noreply.github.com>"]
description = "Small desktop browser (Proof of Concept). HTML, CSS, layout, C++20 raster compositor, and C++20 RootVM script runtime."
license = "Apache-2.0 AND LicenseRef-Proprietary"
repository = "https://github.com/buntatoes/root-browser"
publish = false

[workspace.dependencies]
root-compress = { path = "../root-compress" }
root-cipher = { path = "../root-cipher" }
root-image = { path = "../root-image" }
root-json = { path = "../root-json" }
root-ttf = { path = "../root-ttf" }
root-gpu = { path = "../root-gpu" }
root-video = { path = "../root-video" }
